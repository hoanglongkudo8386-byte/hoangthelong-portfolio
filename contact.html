            <div class="contact-container">
                <form class="contact-form reveal" action="https://formsubmit.co/hoangthelongpro.vn@gmail.com" method="POST">

                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>

                    </div>
                    <div class="form-group">
                        <label class="form-label" for="message">Nội dung</label>
                        <textarea id="message" name="message" class="form-textarea" required rows="5" placeholder="Nhập nội dung tin nhắn..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-submit">
                        Gửi tin nhắn <i class="fa-solid fa-paper-plane"></i>
